name: beta

# Disabled automatic firing 2026-08-21: this needs TOTEM_APP_SECRET/TOTEM_APP_ID
# (upstream's own bot credentials, not configured on this fork) and a paid
# Blacksmith runner. It was firing hourly and failing/queueing indefinitely with
# no way to succeed. workflow_dispatch kept so it's still runnable manually if
# real credentials for a beta channel ever get configured.
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Git Committer
        id: setup-git-committer
        uses: ./.github/actions/setup-git-committer
        with:
          totem-app-id: ${{ vars.TOTEM_APP_ID }}
          totem-app-secret: ${{ secrets.TOTEM_APP_SECRET }}

      - name: Install Totem
        run: bun i -g totem-ai

      - name: Sync beta branch
        env:
          GH_TOKEN: ${{ steps.setup-git-committer.outputs.token }}
          TOTEM_API_KEY: ${{ secrets.TOTEM_API_KEY }}
        run: bun script/beta.ts
